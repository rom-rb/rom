# this file is managed by rom-rb/devtools project

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/LineLength:
  Max: 100

Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

Layout/SpaceInLambdaLiteral:
  Enabled: false

Lint/BooleanSymbol:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*_spec.rb"
    - "core/spec/**/*_spec.rb"
    - "repository/spec/**/*_spec.rb"
    - "changeset/spec/**/*_spec.rb"

Lint/SuppressedException:
  Exclude:
    - "spec/spec_helper.rb"

Metrics/AbcSize:
  Max: 20

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Max: 150

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10

Metrics/MethodLength:
  Max: 22

Naming/FileName:
  Exclude:
    - "lib/dry-*.rb"

Naming/MemoizedInstanceVariableName:
  Enabled: false

Naming/MethodName:
  Enabled: false

Naming/PredicateName:
  Enabled: false

Style/AccessorGrouping:
  EnforcedStyle: separated

Style/AccessModifierDeclarations:
  Enabled: false

Style/Alias:
  Enabled: true
  EnforcedStyle: prefer_alias_method

Style/AsciiComments:
  Enabled: false

Style/BlockDelimiters:
  Enabled: false

Style/ClassAndModuleChildren:
  Exclude:
    - "spec/**/*_spec.rb"
    - "core/spec/**/*_spec.rb"
    - "repository/spec/**/*_spec.rb"
    - "changeset/spec/**/*_spec.rb"

Style/ConditionalAssignment:
  Enabled: false

Style/DateTime:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/EachWithObject:
  Enabled: false

Style/FormatString:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/HashAsLastArrayItem:
  EnforcedStyle: no_braces

Style/IfUnlessModifier:
  Enabled: false

Style/LambdaCall:
  Enabled: false

Style/StabbyLambdaParentheses:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/SymbolArray:
  Exclude:
    - "spec/**/*_spec.rb"
